<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111f73"><title>CIS Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb;color:#182033}header{background:#111f73;color:#fff;padding:22px 18px;position:sticky;top:0}header h1{font-size:22px;margin:0 0 5px}header p{margin:0;opacity:.8;font-size:13px}main{max-width:650px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 20px #0001}h2{font-size:19px;margin:0 0 14px}.label{font-size:13px;font-weight:bold;display:block;margin:12px 0 6px}input,textarea{width:100%;padding:14px;border:1px solid #d9deeb;border-radius:12px;font-size:16px}textarea{min-height:110px}button{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:bold;background:#2439b8;color:white;margin-top:12px}.green{background:#159b62}.red{background:#b42318}.hidden{display:none}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tabs button{margin:0;background:#e9edff;color:#2439b8}.tabs .active{background:#2439b8;color:#fff}.item{border:1px solid #e2e6f0;border-radius:13px;padding:13px;margin-top:10px}.item b{display:block;margin-bottom:5px}.muted{color:#65708a;font-size:13px}.small{width:auto;padding:9px 12px;font-size:13px}
</style></head><body>
<header><h1>🏫 CIS Admin</h1><p>Cambridge International School • Satkhira</p></header>
<main>
<section id="login" class="card"><h2>🔐 Admin Login</h2><label class="label">Password</label><input id="pw" type="password" placeholder="Enter admin password"><button onclick="login()">LOGIN</button><p id="msg"></p></section>
<section id="app" class="hidden">
<div class="tabs"><button id="at" class="active" onclick="tab('ann')">📢 Announcements</button><button id="rt" onclick="tab('res')">📊 Results</button></div>
<div id="ann" class="card"><h2>📢 New Announcement</h2><label class="label">Title</label><input id="title" placeholder="e.g. School will remain closed"><label class="label">Message</label><textarea id="text" placeholder="Write your announcement..."></textarea><label class="label">Date</label><input id="date" type="date"><button class="green" onclick="addA()">SAVE ANNOUNCEMENT</button><div id="alist"></div></div>
<div id="res" class="card hidden"><h2>📊 New Result</h2><label class="label">Exam</label><input id="exam" placeholder="e.g. Half Yearly Examination"><label class="label">Class</label><input id="cls" placeholder="e.g. Class 7"><label class="label">Student name</label><input id="name" placeholder="Student name"><label class="label">Roll</label><input id="roll" placeholder="Roll number"><label class="label">Marks / Grade</label><input id="marks" placeholder="e.g. 85% or A+"><button class="green" onclick="addR()">SAVE RESULT</button><div id="rlist"></div></div>
<div class="card"><h2>⚙️ Data</h2><p class="muted">This simple version stores data on this phone/browser. It does not automatically publish to the public website.</p><button onclick="backup()">⬇️ BACKUP DATA</button><button class="red" onclick="clearData()">DELETE ALL LOCAL DATA</button></div>
</section></main>
<script>
const PASSWORD="CISadmin123";let A=JSON.parse(localStorage.getItem("cisA")||"[]"),R=JSON.parse(localStorage.getItem("cisR")||"[]");
function login(){if(pw.value===PASSWORD){login.classList?.remove;document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");render()}else msg.textContent="❌ Wrong password"}
function tab(x){ann.classList.toggle("hidden",x!="ann");res.classList.toggle("hidden",x!="res");at.classList.toggle("active",x=="ann");rt.classList.toggle("active",x=="res")}
function save(){localStorage.setItem("cisA",JSON.stringify(A));localStorage.setItem("cisR",JSON.stringify(R))}
function addA(){if(!title.value.trim()||!text.value.trim())return alert("Enter title and message.");A.unshift({title:title.value,text:text.value,date:date.value});save();title.value=text.value=date.value="";render()}
function addR(){if(!exam.value||!cls.value||!name.value||!marks.value)return alert("Fill Exam, Class, Student and Marks.");R.unshift({exam:exam.value,cls:cls.value,name:name.value,roll:roll.value,marks:marks.value});save();name.value=roll.value=marks.value="";render()}
function render(){alist.innerHTML=A.length?A.map((x,i)=>'<div class="item"><b>'+e(x.title)+'</b><div>'+e(x.text)+'</div><span class="muted">'+e(x.date||"")+'</span><br><button class="small red" onclick="delA('+i+')">Delete</button></div>').join(""):"<p class='muted'>No announcements yet.</p>";rlist.innerHTML=R.length?R.map((x,i)=>'<div class="item"><b>'+e(x.name)+'</b><div>'+e(x.marks)+' • '+e(x.cls)+' • Roll '+e(x.roll)+'</div><span class="muted">'+e(x.exam)+'</span><br><button class="small red" onclick="delR('+i+')">Delete</button></div>').join(""):"<p class='muted'>No results yet.</p>"}
function delA(i){A.splice(i,1);save();render()}function delR(i){R.splice(i,1);save();render()}function clearData(){if(confirm("Delete all data?")){A=[];R=[];save();render()}}function e(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function backup(){let b=new Blob([JSON.stringify({A,R},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="cis-backup.json";a.click()}
</script></body></html>
